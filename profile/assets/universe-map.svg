<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">SolutionWCMD connected production map</title>
  <desc id="desc">Animated diagram connecting narrative, game production, visual development, systems, web services, and public projects to the SolutionWCMD universe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset=".55" stop-color="#0c0d14"/>
      <stop offset="1" stop-color="#100b12"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fc6ff"/>
      <stop offset=".35" stop-color="#7357d8"/>
      <stop offset=".68" stop-color="#d93245"/>
      <stop offset="1" stop-color="#f1c65a"/>
    </linearGradient>
    <radialGradient id="centerGlow">
      <stop offset="0" stop-color="#7657dc" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7657dc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cfd4df" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="590" rx="24"/></clipPath>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .link{fill:none;stroke-width:2;stroke-dasharray:7 12;animation:flow 12s linear infinite}
      .link2{fill:none;stroke-width:2;stroke-dasharray:5 14;animation:flowReverse 15s linear infinite}
      .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .pulse2{animation:pulse 3s ease-in-out .8s infinite;transform-box:fill-box;transform-origin:center}
      .pulse3{animation:pulse 3s ease-in-out 1.6s infinite;transform-box:fill-box;transform-origin:center}
      .rotate{animation:rotate 24s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes flow{to{stroke-dashoffset:-152}}
      @keyframes flowReverse{to{stroke-dashoffset:152}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes rotate{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.link,.link2,.pulse,.pulse2,.pulse3,.rotate{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="590" fill="url(#bg)"/>
    <rect width="1200" height="590" fill="url(#grid)"/>
    <ellipse cx="600" cy="310" rx="365" ry="255" fill="url(#centerGlow)"/>

    <text x="54" y="58" class="mono" font-size="13" letter-spacing="1.7" fill="#8e99aa">PRODUCTION_MAP://CONNECTED_UNIVERSE</text>
    <text x="54" y="92" class="sans" font-size="24" font-weight="750" fill="#ececf0">One canon. Multiple disciplines. Playable results.</text>

    <path class="link" d="M290 166H410L505 256" stroke="#3fc6ff" stroke-opacity=".66"/>
    <path class="link2" d="M910 166H790L695 256" stroke="#f1c65a" stroke-opacity=".66"/>
    <path class="link2" d="M290 306H470" stroke="#8a6cf1" stroke-opacity=".62"/>
    <path class="link" d="M910 306H730" stroke="#42c3df" stroke-opacity=".62"/>
    <path class="link" d="M290 446H410L505 356" stroke="#d93245" stroke-opacity=".62"/>
    <path class="link2" d="M910 446H790L695 356" stroke="#67c79b" stroke-opacity=".62"/>

    <g transform="translate(40 120)">
      <rect width="250" height="92" rx="15" fill="#0b141d" stroke="#3fc6ff" stroke-opacity=".56"/>
      <circle cx="25" cy="27" r="6" fill="#3fc6ff" class="pulse"/>
      <text x="43" y="33" class="sans" font-size="18" font-weight="740" fill="#e8f9ff">Narrative</text>
      <text x="25" y="59" class="mono" font-size="11.5" fill="#91a9b8">canon / character / continuity</text>
      <text x="25" y="77" class="mono" font-size="11.5" fill="#6e8290">scene intent / world rules</text>
    </g>

    <g transform="translate(910 120)">
      <rect width="250" height="92" rx="15" fill="#1a160e" stroke="#f1c65a" stroke-opacity=".60"/>
      <circle cx="25" cy="27" r="6" fill="#f1c65a" class="pulse2"/>
      <text x="43" y="33" class="sans" font-size="18" font-weight="740" fill="#fff4c9">Game</text>
      <text x="25" y="59" class="mono" font-size="11.5" fill="#b7a77a">control / pacing / close combat</text>
      <text x="25" y="77" class="mono" font-size="11.5" fill="#8c805f">puzzles / stealth / encounters</text>
    </g>

    <g transform="translate(40 260)">
      <rect width="250" height="92" rx="15" fill="#151120" stroke="#8468e8" stroke-opacity=".60"/>
      <circle cx="25" cy="27" r="6" fill="#8f73f5" class="pulse3"/>
      <text x="43" y="33" class="sans" font-size="18" font-weight="740" fill="#eee8ff">Visual development</text>
      <text x="25" y="59" class="mono" font-size="11.5" fill="#aaa0c6">characters / worlds / interface</text>
      <text x="25" y="77" class="mono" font-size="11.5" fill="#817895">animation / key art / reference</text>
    </g>

    <g transform="translate(910 260)">
      <rect width="250" height="92" rx="15" fill="#0c171b" stroke="#42c3df" stroke-opacity=".58"/>
      <circle cx="25" cy="27" r="6" fill="#42c3df" class="pulse"/>
      <text x="43" y="33" class="sans" font-size="18" font-weight="740" fill="#e2faff">Systems</text>
      <text x="25" y="59" class="mono" font-size="11.5" fill="#91adb3">Unity / architecture / shared tools</text>
      <text x="25" y="77" class="mono" font-size="11.5" fill="#6d858a">rendering / pipelines / QA</text>
    </g>

    <g transform="translate(40 400)">
      <rect width="250" height="92" rx="15" fill="#1b1015" stroke="#d93245" stroke-opacity=".56"/>
      <circle cx="25" cy="27" r="6" fill="#e4485d" class="pulse2"/>
      <text x="43" y="33" class="sans" font-size="18" font-weight="740" fill="#ffe5e9">Web and services</text>
      <text x="25" y="59" class="mono" font-size="11.5" fill="#b9969d">website / APIs / communication</text>
      <text x="25" y="77" class="mono" font-size="11.5" fill="#8c7278">deployment / operations</text>
    </g>

    <g transform="translate(910 400)">
      <rect width="250" height="92" rx="15" fill="#0d1815" stroke="#67c79b" stroke-opacity=".56"/>
      <circle cx="25" cy="27" r="6" fill="#67c79b" class="pulse3"/>
      <text x="43" y="33" class="sans" font-size="18" font-weight="740" fill="#e0fff1">Public work</text>
      <text x="25" y="59" class="mono" font-size="11.5" fill="#95b5a6">packages / playable experiments</text>
      <text x="25" y="77" class="mono" font-size="11.5" fill="#718b7e">documentation / contributions</text>
    </g>

    <g transform="translate(600 306)">
      <g class="rotate">
        <circle r="132" fill="none" stroke="#788296" stroke-opacity=".25" stroke-dasharray="3 11"/>
        <circle cx="132" cy="0" r="5" fill="#d93245" filter="url(#glow)"/>
      </g>
      <circle r="106" fill="#090a10" stroke="url(#ring)" stroke-width="3"/>
      <path d="M0-68 68 0 0 68-68 0Z" fill="#10121a" stroke="#69738a" stroke-opacity=".65"/>
      <path d="M0-29 29 0 0 29-29 0Z" fill="#f1c65a" filter="url(#glow)" class="pulse"/>
      <text x="0" y="4" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#08090d">S</text>
      <text x="0" y="92" text-anchor="middle" class="sans" font-size="19" font-weight="780" letter-spacing="1.3" fill="#f1f1f3">SOLUTIONWCMD</text>
      <text x="0" y="114" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1.6" fill="#9ca5b5">UNIVERSE CORE</text>
    </g>

    <circle cx="410" cy="166" r="4.5" fill="#3fc6ff" filter="url(#glow)" class="pulse"/>
    <circle cx="790" cy="166" r="4.5" fill="#f1c65a" filter="url(#glow)" class="pulse2"/>
    <circle cx="470" cy="306" r="4.5" fill="#8f73f5" filter="url(#glow)" class="pulse3"/>
    <circle cx="730" cy="306" r="4.5" fill="#42c3df" filter="url(#glow)" class="pulse"/>
    <circle cx="410" cy="446" r="4.5" fill="#e4485d" filter="url(#glow)" class="pulse2"/>
    <circle cx="790" cy="446" r="4.5" fill="#67c79b" filter="url(#glow)" class="pulse3"/>

    <text x="600" y="552" text-anchor="middle" class="mono" font-size="12.5" letter-spacing="1.8" fill="#8791a1">STORY ↔ IMPLEMENTATION ↔ EVIDENCE ↔ DELIVERY</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="588.5" rx="23.25" fill="none" stroke="#8992a2" stroke-opacity=".32" stroke-width="1.5"/>
</svg>